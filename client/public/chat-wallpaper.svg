<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 260" width="260" height="260">
  <!-- Kanmani chat wallpaper — Sangam-era / Tamizhi doodle tile.
       Motifs: yazh harp, kuthu vilakku, Pandya fish, Chera bow, parai drum,
       kolam, burial urn, Tamizhi letters, gopuram, silambu anklet,
       olai-chuvadi manuscript, temple bell, chariot wheel, paddy, sun, lotus. -->
  <g fill="none" stroke="#C24A2D" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" opacity="0.1">

    <!-- row 1 -->
    <g transform="translate(6,6) rotate(-6 16 16)"><!-- yazh -->
      <path d="M6 28 Q4 8 20 4"/>
      <path d="M8 24 L16 6 M10 26 L20 7 M12 27 L24 8"/>
      <path d="M5 28 Q10 33 15 29"/>
    </g>
    <g transform="translate(71,8) rotate(4 16 16)"><!-- kuthu vilakku -->
      <path d="M16 3 q2 3 0 5 q-2 -2 0 -5"/>
      <path d="M11 9 h10 l-2 4 h-6 z"/>
      <path d="M16 13 v8 M12 21 h8 M10 24 h12 M8 27 h16"/>
    </g>
    <g transform="translate(136,5) rotate(-5 16 16)"><!-- Pandya fish -->
      <path d="M4 16 Q11 8 18 16 Q11 24 4 16 Z M18 16 L26 10 M18 16 L26 22"/>
      <circle cx="9" cy="15" r="0.9" fill="#C24A2D" stroke="none"/>
    </g>
    <g transform="translate(201,7) rotate(7 16 16)"><!-- Chera bow -->
      <path d="M7 27 Q16 5 25 27 M7 27 H25"/>
      <path d="M16 27 V9 M13 12 L16 9 L19 12"/>
    </g>

    <!-- row 2 -->
    <g transform="translate(38,70) rotate(5 16 16)"><!-- parai drum -->
      <rect x="5" y="12" width="22" height="8" rx="3"/>
      <path d="M7 12 l4 8 l4 -8 l4 8 l4 -8"/>
    </g>
    <g transform="translate(103,72) rotate(-4 16 16)"><!-- kolam -->
      <path d="M16 5 L27 16 L16 27 L5 16 Z"/>
      <circle cx="16" cy="16" r="5"/>
      <circle cx="16" cy="16" r="1" fill="#C24A2D" stroke="none"/>
    </g>
    <g transform="translate(168,69) rotate(6 16 16)"><!-- burial urn -->
      <path d="M10 6 h12 M11 6 q-6 12 2 18 h6 q8 -6 2 -18 M10 13 h12"/>
    </g>
    <g transform="translate(233,72) rotate(-6 16 16)"><!-- Tamizhi ka -->
      <path d="M16 6 v20 M8 16 h16"/>
    </g>

    <!-- row 3 -->
    <g transform="translate(6,134) rotate(4 16 16)"><!-- gopuram -->
      <path d="M6 27 h20 M8 27 v-5 h16 v5 M10 22 v-5 h12 v5 M12 17 v-4 h8 v4 M14 13 v-4 h4 v4 M16 9 v-4"/>
    </g>
    <g transform="translate(71,136) rotate(-7 16 16)"><!-- silambu anklet -->
      <circle cx="16" cy="16" r="9"/>
      <circle cx="16" cy="7" r="1.2"/><circle cx="22.4" cy="9.6" r="1.2"/><circle cx="25" cy="16" r="1.2"/>
      <circle cx="22.4" cy="22.4" r="1.2"/><circle cx="16" cy="25" r="1.2"/><circle cx="9.6" cy="22.4" r="1.2"/>
      <circle cx="7" cy="16" r="1.2"/><circle cx="9.6" cy="9.6" r="1.2"/>
    </g>
    <g transform="translate(136,133) rotate(5 16 16)"><!-- olai chuvadi -->
      <rect x="5" y="10" width="22" height="3.5" rx="1.75"/>
      <rect x="5" y="15" width="22" height="3.5" rx="1.75"/>
      <rect x="5" y="20" width="22" height="3.5" rx="1.75"/>
      <path d="M16 8 v18 M23 26 L29 30"/>
    </g>
    <g transform="translate(201,135) rotate(-4 16 16)"><!-- temple bell -->
      <path d="M11 19 Q11 7 16 7 Q21 7 21 19 M9 19 h14 M14 7 q2 -3 4 0"/>
      <circle cx="16" cy="22" r="1.5" fill="#C24A2D" stroke="none"/>
    </g>

    <!-- row 4 -->
    <g transform="translate(38,198) rotate(-5 16 16)"><!-- chariot wheel -->
      <circle cx="16" cy="16" r="10"/>
      <path d="M16 6 V26 M6 16 H26 M9 9 L23 23 M23 9 L9 23"/>
      <circle cx="16" cy="16" r="2"/>
    </g>
    <g transform="translate(103,200) rotate(6 16 16)"><!-- paddy stalk -->
      <path d="M16 28 V8 M16 8 q1 -3 4 -4"/>
      <path d="M16 11 q-4 -3 -5 -6 M16 11 q4 -3 5 -6 M16 16 q-4 -3 -5 -6 M16 16 q4 -3 5 -6 M16 21 q-4 -3 -5 -6"/>
    </g>
    <g transform="translate(168,197) rotate(-6 16 16)"><!-- pottery sun mark -->
      <circle cx="16" cy="16" r="5"/>
      <path d="M16 4 V8 M16 24 V28 M4 16 H8 M24 16 H28 M8 8 L11 11 M24 8 L21 11 M8 24 L11 21 M24 24 L21 21"/>
    </g>
    <g transform="translate(233,199) rotate(5 16 16)"><!-- lotus -->
      <path d="M16 6 Q19 12 16 17 Q13 12 16 6"/>
      <path d="M16 17 Q9 15 7 8 Q13 9 16 13 M16 17 Q23 15 25 8 Q19 9 16 13"/>
      <path d="M7 20 Q16 25 25 20"/>
    </g>

    <!-- fillers between cells -->
    <g transform="translate(40,40) scale(0.5)"><path d="M6 20 V8 L12 4 L18 8 V20"/></g><!-- Tamizhi ma -->
    <g transform="translate(170,40) scale(0.5)"><path d="M3 16 L8 8 L13 16 L18 8 L21 12"/></g><!-- river -->
    <g transform="translate(105,104) scale(0.5)"><path d="M8 3 V21 M16 3 V21 M8 8 H16 M8 13 H16 M8 18 H16"/></g><!-- ladder -->
    <g transform="translate(235,104) scale(0.5)"><path d="M12 4 V20 M12 9 Q6 9 6 14"/></g><!-- Tamizhi ta -->
    <g transform="translate(40,170) scale(0.5)"><path d="M5 13 Q5 4 12 4 Q19 4 19 13 V20"/></g><!-- Tamizhi ya -->
    <g transform="translate(170,168) scale(0.5)"><path d="M5 5 H19 M12 5 V20"/></g><!-- Tamizhi na -->
    <g transform="translate(105,232) scale(0.5)"><path d="M6 20 V8 L12 4 L18 8 V20"/></g>
    <g transform="translate(235,232) scale(0.5)"><path d="M3 16 L8 8 L13 16 L18 8 L21 12"/></g>
    <circle cx="24" cy="106" r="1" fill="#C24A2D" stroke="none"/>
    <circle cx="154" cy="42" r="1" fill="#C24A2D" stroke="none"/>
    <circle cx="88" cy="170" r="1" fill="#C24A2D" stroke="none"/>
    <circle cx="219" cy="170" r="1" fill="#C24A2D" stroke="none"/>
    <circle cx="24" cy="234" r="1" fill="#C24A2D" stroke="none"/>
    <circle cx="154" cy="234" r="1" fill="#C24A2D" stroke="none"/>
  </g>
</svg>
