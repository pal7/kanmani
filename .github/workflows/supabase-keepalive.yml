name: Supabase Keep-Alive

# Free-tier Supabase projects auto-pause after ~7 days without API traffic.
# Ping the REST endpoint twice a week so the project stays awake.
on:
  schedule:
    - cron: '17 6 * * 1,4' # Mon & Thu 06:17 UTC (offset to avoid top-of-hour congestion)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST endpoint
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          code=$(curl -s -o /tmp/body -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/chats?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "HTTP $code"
          # 200 = alive (RLS returns an empty array for anon; that's fine —
          # the request itself counts as activity). Anything else means the
          # project is paused or broken: fail the run so it's visible.
          if [ "$code" != "200" ]; then
            cat /tmp/body
            exit 1
          fi
