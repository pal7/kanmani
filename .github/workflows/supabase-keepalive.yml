name: Supabase Keep-Alive

# Free-tier Supabase projects auto-pause after ~7 days without API traffic.
# Ping the REST endpoint twice a week so the project stays awake.
on:
  schedule:
    - cron: '17 6 * * 1,4' # Mon & Thu 06:17 UTC (offset to avoid top-of-hour congestion)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST endpoint
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          # Liveness: auth health answers 200 to the anon key when the
          # project is awake, and fails hard (DNS) when paused.
          code=$(curl -s -o /tmp/body -w "%{http_code}" \
            "$SUPABASE_URL/auth/v1/health" \
            -H "apikey: $SUPABASE_ANON_KEY")
          echo "auth health: HTTP $code"
          if [ "$code" != "200" ]; then
            cat /tmp/body
            exit 1
          fi
          # Activity: touch the Data API so Postgres sees traffic. anon has
          # no grant on chats, so 401/42501 is expected — the denial itself
          # is issued by Postgres, which is what counts.
          curl -s -o /dev/null -w "rest ping: HTTP %{http_code}\n" \
            "$SUPABASE_URL/rest/v1/chats?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY"
